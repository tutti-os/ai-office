name: AI Slide / Check Tutti App

on:
  workflow_dispatch:
  pull_request:
    paths:
      - ".github/workflows/check-slide-tutti.yml"
      - "apps/slide/**"
      - "packages/**"
      - "scripts/check-doc-i18n.mjs"
      - "scripts/validate-tutti-app-package.mjs"
      - "tooling/tutti/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"
  push:
    branches:
      - main
    paths:
      - ".github/workflows/check-slide-tutti.yml"
      - "apps/slide/**"
      - "packages/**"
      - "scripts/check-doc-i18n.mjs"
      - "scripts/validate-tutti-app-package.mjs"
      - "tooling/tutti/**"
      - "package.json"
      - "pnpm-lock.yaml"
      - "pnpm-workspace.yaml"
      - "tsconfig.base.json"

jobs:
  check:
    name: Check (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10.11.0

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Check shared packages and AI Slide
        run: pnpm -r --filter "./packages/*" --if-present check && pnpm --filter @ai-slide/app check

      - name: Test shared Windows adapters
        run: pnpm --filter @ai-app/shared test && pnpm --filter @ai-app/tutti-packager test

      - name: Check AI Slide i18n
        run: pnpm --filter @ai-slide/app check:i18n

      - name: Package AI Slide Tutti app
        run: pnpm package:slide-tutti

      - name: Validate AI Slide Tutti package
        run: pnpm validate:slide-tutti
